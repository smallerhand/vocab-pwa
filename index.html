<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>영어 단어장</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="단어장">
<meta name="theme-color" content="#E4EBEF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --desk:#E4EBEF; --card:#FFFFFF; --ink:#16283A; --muted:#5F7385; --rule:#CBD6DD;
  --hl:#FFD84D; --good:#1F7A58; --mid:#A96A12; --bad:#C2392F; --on-solid:#FFFFFF;
  --body:system-ui,-apple-system,"Apple SD Gothic Neo","Hiragino Sans",sans-serif;
  --display:system-ui,-apple-system,"Helvetica Neue",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#111B25; --card:#1B2937; --ink:#E7EEF3; --muted:#93A5B4; --rule:#2F4254;
    --hl:rgba(255,216,77,.30); --good:#4FB58C; --mid:#E0A84A; --bad:#EF6B5E; --on-solid:#0E1720;
  }
}
:root[data-theme="dark"]{
  --desk:#111B25; --card:#1B2937; --ink:#E7EEF3; --muted:#93A5B4; --rule:#2F4254;
  --hl:rgba(255,216,77,.30); --good:#4FB58C; --mid:#E0A84A; --bad:#EF6B5E; --on-solid:#0E1720;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--desk);color:var(--ink);font-family:var(--body);
  font-size:16px;line-height:1.55;display:flex;flex-direction:column;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:9px 12px;width:100%}
textarea{min-height:96px;font-size:.875rem}
.wrap{width:100%;max-width:540px;margin:0 auto;padding:0 16px}

header{flex:none;padding-top:12px}
.bar{display:flex;align-items:center;gap:8px}
.seg{display:flex;flex:1;background:var(--rule);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 6px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink)}
.seg.small button{padding:6px;font-size:.875rem}
.icon-btn{border:0;background:transparent;width:42px;height:42px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn[aria-expanded="true"]{background:var(--card);color:var(--ink)}
.counts{display:flex;gap:16px;margin:12px 2px 0;font-size:.875rem;color:var(--muted)}
.counts b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.meter{height:3px;background:var(--rule);border-radius:2px;margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ink);width:0;transition:width .25s ease}

.panel{background:var(--card);border-radius:12px;margin-top:10px;padding:6px 14px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule)}
.set-row.col{display:block}
.set-row:last-child{border-bottom:0}
.set-row small,.help{display:block;color:var(--muted);font-size:.8125rem;line-height:1.4}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.steps button,.pill{border:1px solid var(--rule);background:transparent;border-radius:8px;padding:6px 10px;min-width:42px}
.steps button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.switch{position:relative;width:48px;height:28px;border-radius:14px;border:0;background:var(--rule);flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--card);transition:transform .15s ease}
.switch[aria-checked="true"]{background:var(--good)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.switch:disabled{opacity:.4}
.danger{color:var(--bad);border-color:var(--bad)}
.io-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
.io-row .grow{flex:1}
.field{margin:8px 0}
.field label{display:block;font-size:.8125rem;color:var(--muted);margin-bottom:3px}
.form-actions{display:flex;gap:8px;margin:12px 0 8px}
.solid{border:0;background:var(--ink);color:var(--card);border-radius:12px;padding:12px 18px;font-weight:600}
.solid.sm{padding:9px 14px;border-radius:9px}

main{flex:1;min-height:0;overflow-y:auto;padding:14px 0 18px}
.card{background:var(--card);border-radius:8px;box-shadow:0 1px 0 var(--rule),0 10px 24px -18px rgba(22,40,58,.55);overflow:hidden}
.card-top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-size:.8125rem;color:var(--muted);border-bottom:2px solid var(--bad)}
.front{padding:30px 18px 26px;text-align:center}
.word{font-family:var(--display);font-weight:700;font-size:clamp(2rem,9.5vw,3.1rem);line-height:1.18;margin:0;letter-spacing:-.02em;overflow-wrap:anywhere}
.word span{background:linear-gradient(transparent 58%,var(--hl) 58%,var(--hl) 92%,transparent 92%);padding:0 .12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.ipa{margin:12px 0 0;color:var(--muted);font-size:1.0625rem}
.listen-row{display:flex;justify-content:center;gap:8px;margin-top:16px;flex-wrap:wrap}
.listen{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);background:transparent;border-radius:999px;padding:8px 16px;font-size:.9375rem}
.listen.big{padding:18px 30px;font-size:1.125rem;font-weight:600;background:var(--ink);color:var(--card);border-color:var(--ink)}
.hint{color:var(--muted);margin:16px 0 0;font-size:.9375rem}
.back{border-top:1px solid var(--rule);padding:6px 18px 18px}
.line{display:grid;grid-template-columns:30px 1fr;gap:8px;padding:12px 0;border-bottom:1px solid var(--rule);align-items:start}
.line:last-child{border-bottom:0}
.tag{font-size:.75rem;font-weight:600;color:var(--muted);padding-top:4px}
.ko{font-size:1.3125rem;font-weight:600;line-height:1.4}
.ja{font-family:"Hiragino Sans",system-ui,sans-serif}
.ex{font-size:1.0625rem}
.ex-say{border:0;background:transparent;padding:2px 0 0;color:var(--muted);display:inline-flex;align-items:center;gap:6px;font-size:.875rem}
.note{color:var(--muted);font-size:.9375rem}

.empty{text-align:center;padding:48px 12px;color:var(--muted)}
.empty h2{font-family:var(--display);color:var(--ink);font-size:1.625rem;margin:0 0 8px;font-weight:700}
.empty p{margin:0 auto 18px;max-width:30em}
.banner{background:var(--bad);color:var(--on-solid);border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:.9375rem}
.toast{background:var(--ink);color:var(--card);border-radius:8px;padding:9px 14px;margin-bottom:12px;font-size:.9375rem}

.filters{display:flex;gap:6px;margin:10px 0 12px;flex-wrap:wrap}
.filters button{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:5px 12px;font-size:.875rem;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.list-bar{display:flex;gap:8px;align-items:center;margin-top:10px}
.rows{background:var(--card);border-radius:8px;overflow:hidden}
details{border-bottom:1px solid var(--rule)}
details:last-child{border-bottom:0}
summary{list-style:none;display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding:10px 12px 10px 14px;cursor:pointer}
summary::-webkit-details-marker{display:none}
.dot{width:9px;height:9px;border-radius:50%;border:2px solid var(--muted)}
.dot.s1{background:var(--mid);border-color:var(--mid)}
.dot.s2{background:var(--good);border-color:var(--good)}
.dot.s0{border-style:dashed}
.row-w{font-weight:600;overflow-wrap:anywhere}
.row-k{color:var(--muted);font-size:.9375rem}
.row-k.peek{color:var(--ink)}
.row-r{font-size:.8125rem;color:var(--muted)}
.row-r.g{color:var(--good)} .row-r.b{color:var(--bad)}
.mini{display:flex;gap:4px}
.mini button{border:1px solid var(--rule);background:transparent;border-radius:8px;width:36px;height:34px;display:grid;place-items:center;color:var(--muted);font-weight:700}
.mini button.ok{color:var(--good)} .mini button.no{color:var(--bad)}
.mini button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.detail{padding:0 14px 14px 36px;font-size:.9375rem}
.detail p{margin:6px 0}
.detail .meta{color:var(--muted);font-size:.8125rem}
.detail .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

footer{flex:none;background:var(--desk);padding:10px 0 12px;border-top:1px solid var(--rule)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate button{border:0;border-radius:12px;padding:11px 4px 9px;color:var(--on-solid);font-weight:600;font-size:1.0625rem;line-height:1.25}
.rate small{display:block;font-weight:400;font-size:.75rem;opacity:.9}
.r-bad{background:var(--bad)} .r-mid{background:var(--mid)} .r-good{background:var(--good)}
.reveal{width:100%;border:0;border-radius:12px;padding:16px;background:var(--ink);color:var(--card);font-weight:600;font-size:1.0625rem}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="bar">
    <div class="seg" role="group" aria-label="화면 전환">
      <button data-act="tab" data-tab="study" aria-pressed="true">카드</button>
      <button data-act="tab" data-tab="list" aria-pressed="false">리스트</button>
    </div>
    <button class="icon-btn" data-act="add" aria-expanded="false" aria-label="단어 추가">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="icon-btn" data-act="settings" aria-expanded="false" aria-label="설정">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
    </button>
  </div>
  <div id="form" class="panel" hidden></div>
  <div id="settings" class="panel" hidden></div>
  <div class="counts" id="counts"></div>
  <div class="meter" aria-hidden="true"><i id="meter"></i></div>
</div></header>

<main><div class="wrap" id="view"></div></main>
<footer id="footer" hidden><div class="wrap" id="actions"></div></footer>

<script>
(function(){
"use strict";
var INTERVALS=[0,1,3,7,14,30];
var FIELDS=[["word","단어"],["ipa","발음"],["ko","한국어 뜻"],["en","영어 정의"],["ja","日本語"],["ex","예문"],["note","메모"],["src","출처"]];
var SPK='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
var EYE='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
var canSpeak=("speechSynthesis" in window)&&(typeof SpeechSynthesisUtterance!=="undefined");
var EMBEDDED=[{"word": "reimburse", "ipa": "/ˌriːɪmˈbɜːrs/", "ko": "(경비를) 환급하다, 상환하다", "en": "to pay back money someone has spent", "ja": "払い戻す、(経費を)精算する", "ex": "You'll be reimbursed for the taxi fare.", "note": "reimburse travel expenses (= pay back)", "src": "TOEIC", "added": "2026-09-21", "order": 10, "id": "reimburse"}, {"word": "itinerary", "ipa": "/aɪˈtɪnəreri/", "ko": "여행 일정표", "en": "a detailed plan of a trip", "ja": "旅程表", "ex": "I'll email you the revised itinerary.", "note": "(= travel schedule)", "src": "TOEIC", "added": "2026-09-21", "order": 20, "id": "itinerary"}, {"word": "tentative", "ipa": "/ˈtentətɪv/", "ko": "잠정적인", "en": "not yet definite; may change", "ja": "暫定的な、仮の", "ex": "We have a tentative date of May 3.", "note": "a tentative schedule (= not confirmed)", "src": "TOEIC", "added": "2026-09-21", "order": 30, "id": "tentative"}, {"word": "out of stock", "ipa": "/aʊt əv stɑːk/", "ko": "품절인, 재고가 없는", "en": "not available for sale right now", "ja": "在庫切れ", "ex": "That model is temporarily out of stock.", "note": "반대: in stock (= unavailable, sold out)", "src": "TOEIC", "added": "2026-09-21", "order": 40, "id": "out-of-stock"}, {"word": "put off", "ipa": "/pʊt ɔːf/", "ko": "연기하다", "en": "to delay to a later time", "ja": "延期する、先送りする", "ex": "Let's put off the meeting until Friday.", "note": "(= postpone, reschedule)", "src": "TOEIC", "added": "2026-09-21", "order": 50, "id": "put-off"}, {"word": "fill in for", "ipa": "/fɪl ɪn fər/", "ko": "~의 업무를 대신하다", "en": "to do someone's job while they are away", "ja": "~の代理を務める", "ex": "I'm filling in for Ms. Lee this week.", "note": "(= cover for, substitute for)", "src": "TOEIC", "added": "2026-09-21", "order": 60, "id": "fill-in-for"}, {"word": "eligible", "ipa": "/ˈelɪdʒəbl/", "ko": "자격이 있는, 대상이 되는", "en": "having the right to do or receive something", "ja": "資格のある、対象となる", "ex": "Full-time staff are eligible for paid leave.", "note": "be eligible for + 명사 / to do (= qualified, entitled)", "src": "TOEIC", "added": "2026-09-21", "order": 70, "id": "eligible"}, {"word": "prospective", "ipa": "/prəˈspektɪv/", "ko": "장래의, 예비의", "en": "likely to become or be something in the future", "ja": "見込みのある、将来の", "ex": "We met with several prospective clients.", "note": "prospective employees / buyers (= potential). 주의: perspective(관점)와 혼동", "src": "TOEIC", "added": "2026-09-21", "order": 80, "id": "prospective"}, {"word": "apprehensive", "ipa": "/ˌæprɪˈhensɪv/", "ko": "걱정하는, 불안해하는", "en": "worried about something that may happen", "ja": "不安な、気がかりな", "ex": "She was apprehensive about the interview.", "note": "be apprehensive about (= anxious, nervous)", "src": "TOEIC", "added": "2026-09-21", "order": 90, "id": "apprehensive"}, {"word": "entitle", "ipa": "/ɪnˈtaɪtl/", "ko": "자격·권리를 주다", "en": "to give someone the right to have or do something", "ja": "資格・権利を与える", "ex": "Employees are entitled to fifteen days of leave.", "note": "be entitled to + 명사 / to do", "src": "TOEIC", "added": "2026-09-21", "order": 100, "id": "entitle"}, {"word": "payroll", "ipa": "/ˈpeɪroʊl/", "ko": "급여 대장, 급여 지급 업무", "en": "the list of employees and their pay; the pay process", "ja": "給与台帳、給与支払い業務", "ex": "Contact payroll about your direct deposit.", "note": "on the payroll; payroll department", "src": "TOEIC", "added": "2026-09-21", "order": 110, "id": "payroll"}, {"word": "aptitude", "ipa": "/ˈæptɪtuːd/", "ko": "적성, 소질", "en": "natural ability to learn or do something", "ja": "適性、素質", "ex": "All applicants take an aptitude test.", "note": "have an aptitude for numbers. 주의: attitude와 소리 구별", "src": "TOEIC", "added": "2026-09-21", "order": 120, "id": "aptitude"}, {"word": "insufficient", "ipa": "/ˌɪnsəˈfɪʃnt/", "ko": "불충분한", "en": "not enough", "ja": "不十分な", "ex": "The payment failed because of insufficient funds.", "note": "insufficient experience / information (= inadequate, lacking)", "src": "TOEIC", "added": "2026-09-21", "order": 130, "id": "insufficient"}, {"word": "plentiful", "ipa": "/ˈplentɪfl/", "ko": "풍부한", "en": "available in large amounts", "ja": "豊富な", "ex": "Job openings are plentiful this season.", "note": "a plentiful supply (= abundant, ample)", "src": "TOEIC", "added": "2026-09-21", "order": 140, "id": "plentiful"}, {"word": "apprentice", "ipa": "/əˈprentɪs/", "ko": "수습생, 견습생", "en": "someone learning a skilled job from an expert", "ja": "見習い、実習生", "ex": "He started as an apprentice electrician.", "note": "apprenticeship(수습 제도·기간) (= trainee)", "src": "TOEIC", "added": "2026-09-21", "order": 150, "id": "apprentice"}, {"word": "lay out", "ipa": "/leɪ aʊt/", "ko": "명확히 제시·설명하다; 배치하다", "en": "to explain clearly; to arrange in a pattern", "ja": "明確に説明する；配置する", "ex": "The manual lays out the procedure step by step.", "note": "lay out a plan / the terms. 명사 layout(배치)", "src": "TOEIC", "added": "2026-09-21", "order": 160, "id": "lay-out"}, {"word": "pay raise", "ipa": "/peɪ reɪz/", "ko": "급여 인상", "en": "an increase in salary", "ja": "昇給", "ex": "She asked for a pay raise after the review.", "note": "(= salary increase; 영국식 pay rise)", "src": "TOEIC", "added": "2026-09-21", "order": 170, "id": "pay-raise"}, {"word": "practical experience", "ipa": "/ˈpræktɪkl ɪkˈspɪriəns/", "ko": "실무 경험", "en": "experience gained by actually doing the work", "ja": "実務経験", "ex": "The internship gave me practical experience in sales.", "note": "(= hands-on experience)", "src": "TOEIC", "added": "2026-09-21", "order": 180, "id": "practical-experience"}, {"word": "proof of employment", "ipa": "/pruːf əv ɪmˈplɔɪmənt/", "ko": "재직 증명(서)", "en": "a document showing that someone works at a company", "ja": "在職証明(書)", "ex": "The bank asked for proof of employment.", "note": "(= employment verification)", "src": "TOEIC", "added": "2026-09-21", "order": 190, "id": "proof-of-employment"}, {"word": "reference letter", "ipa": "/ˈrefrəns ˈletər/", "ko": "추천서", "en": "a letter from a former employer or teacher describing someone's abilities", "ja": "推薦状", "ex": "Please provide two reference letters.", "note": "(= letter of recommendation)", "src": "TOEIC", "added": "2026-09-21", "order": 200, "id": "reference-letter"}, {"word": "send off to", "ipa": "/send ɔːf tə/", "ko": "~로 발송하다", "en": "to mail or dispatch something to a place or person", "ja": "~へ発送する", "ex": "I sent my application off to the head office.", "note": "(= mail, submit)", "src": "TOEIC", "added": "2026-09-21", "order": 210, "id": "send-off-to"}, {"word": "set up an interview", "ipa": "/set ʌp ən ˈɪntərvjuː/", "ko": "면접 일정을 잡다", "en": "to arrange an interview", "ja": "面接を設定する", "ex": "I'm calling to set up an interview.", "note": "(= schedule / arrange an interview)", "src": "TOEIC", "added": "2026-09-21", "order": 220, "id": "set-up-an-interview"}, {"word": "workstation", "ipa": "/ˈwɜːrksteɪʃn/", "ko": "(개인) 작업 공간, 업무용 자리", "en": "the desk or area, usually with a computer, where one person works", "ja": "作業スペース、(個人の)作業席", "ex": "Your workstation is next to the copy room.", "note": "Part 1 사진 묘사에도 등장", "src": "TOEIC", "added": "2026-09-21", "order": 230, "id": "workstation"}, {"word": "zealous", "ipa": "/ˈzeləs/", "ko": "열성적인", "en": "full of energy and enthusiasm for something", "ja": "熱心な、熱烈な", "ex": "He is a zealous advocate of workplace safety.", "note": "발음 주의: zeal은 /ziːl/, zealous는 /ˈzel-/ (= enthusiastic, passionate)", "src": "TOEIC", "added": "2026-09-21", "order": 240, "id": "zealous"}, {"word": "devoted", "ipa": "/dɪˈvoʊtɪd/", "ko": "헌신적인", "en": "loyal and giving a lot of time and effort", "ja": "献身的な", "ex": "The award goes to our most devoted employees.", "note": "be devoted to + 명사/-ing (= dedicated, committed)", "src": "TOEIC", "added": "2026-09-21", "order": 250, "id": "devoted"}, {"word": "excel", "ipa": "/ɪkˈsel/", "ko": "뛰어나다, 탁월하다", "en": "to be very good at something", "ja": "秀でる、優れている", "ex": "She excels at negotiating.", "note": "excel in / at. 강세는 2음절", "src": "TOEIC", "added": "2026-09-21", "order": 260, "id": "excel"}, {"word": "get through", "ipa": "/ɡet θr rsthand how the factory operates.", "note": "firsthand experience / knowledge (= direct, in person)", "src": "TOEIC", "added": "2026-09-21", "order": 390, "id": "firsthand"}, {"word": "hiring committee", "ipa": "/ˈhaɪərɪŋ kəˈmɪti/", "ko": "채용 위원회", "en": "the group that reviews and selects job candidates", "ja": "採用委員会", "ex": "The hiring committee will review applications next week.", "note": "committee 강세는 2음절", "src": "TOEIC", "added": "2026-09-21", "order": 400, "id": "hiring-committee"}, {"word": "pertaining to", "ipa": "/pərˈteɪnɪŋ tə/", "ko": "~에 관한", "en": "relating to (formal)", "ja": "~に関する", "ex": "Please send all documents pertaining to the contract.", "note": "(= regarding, concerning, related to)", "src": "TOEIC", "added": "2026-09-21", "order": 410, "id": "pertaining-to"}, {"word": "questionably", "ipa": "/ˈkwestʃənəbli/", "ko": "의심스럽게, 미심쩍게", "en": "in a way that is doubtful or possibly not honest", "ja": "疑わしく、いかがわしく", "ex": "The sales figures were questionably high.", "note": "형용사 questionable이 더 빈출: a questionable decision", "src": "TOEIC", "added": "2026-09-21", "order": 420, "id": "questionably"}, {"word": "regularity", "ipa": "/ˌreɡjuˈlærəti/", "ko": "규칙성, 정기적임", "en": "the quality of happening often or at even intervals", "ja": "規則正しさ、定期性", "ex": "Audits are conducted with regularity.", "note": "with regularity (= regularly)", "src": "TOEIC", "added": "2026-09-21", "order": 430, "id": "regularity"}, {"word": "replenish", "ipa": "/rɪˈplenɪʃ/", "ko": "다시 채우다, 보충하다", "en": "to fill something up again", "ja": "補充する", "ex": "We need to replenish our office supplies.", "note": "replenish stock / inventory (= restock, refill)", "src": "TOEIC", "added": "2026-09-21", "order": 440, "id": "replenish"}, {"word": "stellar", "ipa": "/ˈstelər/", "ko": "뛰어난, 눈부신", "en": "extremely good", "ja": "素晴らしい、卓越した", "ex": "The team delivered a stellar performance this quarter.", "note": "stellar reputation / reviews (= outstanding, excellent)", "src": "TOEIC", "added": "2026-09-21", "order": 450, "id": "stellar"}, {"word": "versatile", "ipa": "/ˈvɜːrsətl/", "ko": "다재다능한; 다용도의", "en": "able to do many things or be used in many ways", "ja": "多才な；用途の広い", "ex": "We need a versatile employee who can handle several roles.", "note": "a versatile tool. 영국식 발음은 /ˈvɜːsətaɪl/", "src": "TOEIC", "added": "2026-09-21", "order": 460, "id": "versatile"}, {"word": "adept", "ipa": "/əˈdept/", "ko": "능숙한", "en": "very skilled at something", "ja": "熟達した、巧みな", "ex": "He is adept at handling difficult customers.", "note": "be adept at / in -ing (= skilled, proficient). 주의: adapt, adopt와 혼동", "src": "TOEIC", "added": "2026-09-21", "order": 470, "id": "adept"}, {"word": "against all odds", "ipa": "/əˈɡenst ɔːl ɑːdz/", "ko": "모든 역경을 딛고", "en": "despite very low chances of success", "ja": "あらゆる困難を乗り越えて", "ex": "Against all odds, the startup survived its first year.", "note": "", "src": "TOEIC", "added": "2026-09-21", "order": 480, "id": "against-all-odds"}, {"word": "command", "ipa": "/kəˈmænd/", "ko": "(언어 등의) 구사력; 명령(하다)", "en": "mastery of a skill, especially a language; an order", "ja": "(言語などの)運用能力；命令", "ex": "Applicants must have a good command of English.", "note": "구인 공고 빈출", "src": "TOEIC", "added": "2026-09-21", "order": 490, "id": "command"}, {"word": "commensurate", "ipa": "/kəˈmenʃərət/", "ko": "상응하는, 비례하는", "en": "matching something in size or degree", "ja": "見合った、相応の", "ex": "Salary is commensurate with experience.", "note": "구인 공고 정형 표현, with와 함께", "src": "TOEIC", "added": "2026-09-21", "order": 500, "id": "commensurate"}, {"word": "computer literate", "ipa": "/kəmˈpjuːtər ˈlɪtərət/", "ko": "컴퓨터를 다룰 줄 아는", "en": "able to use computers well", "ja": "コンピューターを使いこなせる", "ex": "Applicants must be computer literate.", "note": "명사: computer literacy", "src": "TOEIC", "added": "2026-09-21", "order": 510, "id": "computer-literate"}, {"word": "eagerness", "ipa": "/ˈiːɡərnəs/", "ko": "열의, 열망", "en": "strong desire or enthusiasm to do something", "ja": "熱意、意欲", "ex": "Her eagerness to learn impressed the manager.", "note": "(= enthusiasm, keenness)", "src": "TOEIC", "added": "2026-09-21", "order": 520, "id": "eagerness"}, {"word": "familiarize oneself with", "ipa": "/fəˈmɪliəraɪz/", "ko": "~을 숙지하다, 익히다", "en": "to learn about something so that you know it well", "ja": "~に精通する、慣れ親しむ", "ex": "Please familiarize yourself with the safety rules.", "note": "(= get to know, learn)", "src": "TOEIC", "added": "2026-09-21", "order": 530, "id": "familiarize-oneself-with"}, {"word": "increment", "ipa": "/ˈɪŋkrəmənt/", "ko": "증가(분), 정기 승급", "en": "a regular increase in an amount, especially salary", "ja": "増加(分)、定期昇給", "ex": "Staff receive an annual salary increment.", "note": "in increments of 10. 형용사 incremental", "src": "TOEIC", "added": "2026-09-21", "order": 540, "id": "increment"}, {"word": "interpersonal skills", "ipa": "/ˌɪntərˈpɜːrsənl skɪlz/", "ko": "대인 관계 능력", "en": "the ability to communicate and work well with other people", "ja": "対人スキル", "ex": "The position requires strong interpersonal skills.", "note": "(= people skills, communication skills)", "src": "TOEIC", "added": "2026-09-21", "order": 550, "id": "interpersonal-skills"}, {"word": "mindful", "ipa": "/ˈmaɪndfl/", "ko": "유념하는, 의식하는", "en": "careful to remember or consider something", "ja": "心に留めている、注意している", "ex": "Please be mindful of the deadline.", "note": "be mindful of others (= aware, conscious)", "src": "TOEIC", "added": "2026-09-21", "order": 560, "id": "mindful"}, {"word": "preeminent", "ipa": "/priˈemɪnənt/", "ko": "탁월한, 걸출한", "en": "better or more important than all others", "ja": "卓越した、抜群の", "ex": "She is a preeminent expert in tax law.", "note": "(= leading, foremost)", "src": "TOEIC", "added": "2026-09-21", "order": 570, "id": "preeminent"}, {"word": "preliminary", "ipa": "/prɪˈlɪmɪneri/", "ko": "예비의, 사전의", "en": "happening before the main event, as preparation", "ja": "予備の、準備段階の", "ex": "Preliminary interviews will be held by phone.", "note": "preliminary results / research (= initial)", "src": "TOEIC", "added": "2026-09-21", "order": 580, "id": "preliminary"}, {"word": "prerequisite", "ipa": "/ˌpriːˈrekwəzɪt/", "ko": "전제 조건, 필수 요건", "en": "something required before something else can happen", "ja": "前提条件、必須要件", "ex": "A degree is a prerequisite for the position.", "note": "a prerequisite for / to (= requirement)", "src": "TOEIC", "added": "2026-09-21", "order": 590, "id": "prerequisite"}, {"word": "probationer", "ipa": "/proʊˈbeɪʃənər/", "ko": "수습 사원", "en": "a new employee in a trial period", "ja": "試用期間中の社員", "ex": "Probationers are evaluated after three months.", "note": "실전에서는 probation / probationary period(수습 기간)가 더 자주 나온다", "src": "TOEIC", "added": "2026-09-21", "order": 600, "id": "probationer"}, {"word": "sternly", "ipa": "/ˈstɜːrnli/", "ko": "엄격하게, 단호하게", "en": "in a serious, strict way", "ja": "厳しく、厳格に", "ex": "The manager sternly reminded staff of the policy.", "note": "sternly warn (= strictly, severely)", "src": "TOEIC", "added": "2026-09-21", "order": 610, "id": "sternly"}];

var WKEY="vocab-words-v2",DKEY="vocab-deleted-v2",PKEY="vocab-progress-v1",OKEY="vocab-opt";
function lsGet(k){try{var r=localStorage.getItem(k);return r?JSON.parse(r):null;}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));S.saveError=false;return true;}catch(e){S.saveError=true;return false;}}
function persistWords(){lsSet(WKEY,S.words);lsSet(DKEY,S.deleted);}

/* helpers */
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function pad(n){return n<10?"0"+n:""+n;}
function fmt(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function today(){return fmt(new Date());}
function plus(n){var d=new Date();d.setDate(d.getDate()+n);return fmt(d);}
function inLabel(n){return n<=1?"내일 다시":n+"일 뒤";}
function stageLabel(p){if(!p)return"신규";if(p.s>=5)return"정착";return"복습중 · "+INTERVALS[Math.max(1,p.s)]+"일 간격";}
function bucket(w,p){if(!w.ko)return"nodef";return !p?"new":(p.s>=5?"done":"learning");}
function slug(w){var s=String(w||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");return s||("w"+Date.now().toString(36));}
function nextOrder(){var m=0;S.order.forEach(function(id){var o=S.words[id].order;if(typeof o==="number"&&o>m)m=o;});return m+10;}
function rebuildOrder(){S.order=Object.keys(S.words).sort(function(a,b){var x=S.words[a].order,y=S.words[b].order;x=typeof x==="number"?x:1e9;y=typeof y==="number"?y:1e9;return x-y||(a<b?-1:1);});}
function clean(o){var r={},k;for(k in o){if(o[k]!==""&&o[k]!=null)r[k]=o[k];}return r;}
function toast(m){S.toast=m;render();setTimeout(function(){if(S.toast===m){S.toast="";render();}},2200);}

/* speech */
var voice=null;
function pickVoice(){if(!canSpeak)return;try{var vs=speechSynthesis.getVoices()||[];
  voice=vs.filter(function(v){return /^en[-_]US/i.test(v.lang);})[0]||vs.filter(function(v){return /^en/i.test(v.lang);})[0]||null;}catch(e){}}
if(canSpeak){pickVoice();try{speechSynthesis.addEventListener("voiceschanged",pickVoice);}catch(e){}}
function speak(text){if(!canSpeak||!text)return;try{speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text);u.lang="en-US";if(voice)u.voice=voice;u.rate=S.opt.slow?0.75:0.95;speechSynthesis.speak(u);}catch(e){}}

/* queue (card mode) */
function buildQueue(){var t=today(),due=[],fresh=[],introduced=0,k;
  for(k in S.prog){if(S.prog[k]&&S.prog[k].first===t)introduced++;}
  S.order.forEach(function(id){var w=S.words[id],p=S.prog[id];if(!w.ko)return;if(!p)fresh.push(id);else if(p.due<=t)due.push(id);});
  due.sort(function(a,b){return S.prog[a].due<S.prog[b].due?-1:S.prog[a].due>S.prog[b].due?1:0;});
  var room=Math.max(0,S.opt.newPerDay+S.extraNew-introduced);
  S.queue=due.concat(fresh.slice(0,room));S.done=0;S.revealed=false;}
function current(){while(S.queue.length&&!(S.words[S.queue[0]]&&S.words[S.queue[0]].ko))S.queue.shift();return S.queue.length?S.words[S.queue[0]]:null;}
function freshLeft(){var n=0;S.order.forEach(function(id){if(S.words[id].ko&&!S.prog[id])n++;});return n;}
function dueTomorrow(){var t=plus(1),n=0,k;for(k in S.prog){if(S.words[k]&&S.prog[k].due<=t)n++;}return n;}

/* grading */
function grade(id,kind,again){var t=today(),p=S.prog[id];
  if(!p)p={s:0,due:t,first:t,fails:0};
  if(kind==="bad"){p.s=1;p.due=plus(1);p.fails=(p.fails||0)+1;}
  else if(again||kind==="mid"){p.s=Math.max(1,p.s);p.due=plus(1);}
  else{p.s=Math.min(5,p.s+1);p.due=plus(INTERVALS[p.s]);}
  p.last=t;S.prog[id]=p;persistProg();return p;}
function rate(kind){var w=current();if(!w)return;var id=w.id;
  grade(id,kind,!!S.failedToday[id]);
  if(kind==="bad"){S.failedToday[id]=true;S.queue.shift();S.queue.splice(Math.min(S.queue.length,4),0,id);}
  else{S.queue.shift();S.done++;}
  S.revealed=false;render();autoSay();}
function autoSay(){var w=current();if(w&&S.opt.audioFirst&&S.tab==="study")speak(w.say||w.word);}

/* words */
function upsertWord(item,overwrite){if(!item||typeof item.word!=="string"||!item.word.trim())return null;
  var id=(item.id&&S.words[item.id])?item.id:slug(item.word),ex=S.words[id],k,changed=false;
  if(ex&&ex.word.toLowerCase()!==item.word.trim().toLowerCase()){var i=2;while(S.words[id+"-"+i])i++;id=id+"-"+i;ex=null;}
  if(ex){FIELDS.concat([["say",""]]).forEach(function(f){k=f[0];if(typeof item[k]==="string"&&item[k].trim()!==""&&item[k]!==ex[k]){if(overwrite||!ex[k]){ex[k]=item[k].trim();changed=true;}}});
    return changed?"updated":"same";}
  var w={id:id,word:item.word.trim(),added:today(),order:typeof item.order==="number"?item.order:nextOrder()};
  FIELDS.concat([["say",""]]).forEach(function(f){k=f[0];if(k!=="word"&&typeof item[k]==="string"&&item[k].trim()!=="")w[k]=item[k].trim();});
  S.words[id]=w;delete S.deleted[id];rebuildOrder();return "added";}
function deleteWord(id){delete S.words[id];delete S.prog[id];S.deleted[id]=1;rebuildOrder();persistWords();persistProg();
  S.queue=S.queue.filter(function(x){return x!==id;});}

/* import / export */
function exportText(){var ids;
  if(S.exScope==="list")ids=S.listIds.slice();
  else if(S.exScope==="nodef")ids=S.order.filter(function(id){return !S.words[id].ko;});
  else ids=S.order.slice();
  var out={v:2,exported:today(),words:ids.map(function(id){return clean(S.words[id]);})};
  if(S.exProg){out.cards={};ids.forEach(function(id){if(S.prog[id])out.cards[id]=S.prog[id];});}
  return JSON.stringify(out,null,1);}
function parseImport(txt){txt=String(txt||"").trim();if(!txt)return{};var o=null;
  try{o=JSON.parse(txt);}catch(e){}
  if(o===null){return{words:txt.split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean).map(function(l){var p=l.split(/\t|\s{2,}\|?\s*|\s\|\s/);return p.length>1?{word:p[0].trim(),ko:p.slice(1).join(" ").trim()}:{word:l};})};}
  if(Array.isArray(o))return{words:o};
  if(o&&typeof o==="object"){var r={};if(Array.isArray(o.words))r.words=o.words;if(o.cards&&typeof o.cards==="object")r.cards=o.cards;
    if(!r.words&&!r.cards){var ks=Object.keys(o),vs=ks.map(function(k){return o[k];});
      if(vs.length&&vs.every(function(v){return v&&typeof v.s==="number";}))r.cards=o;
      else if(vs.length&&vs.every(function(v){return v&&typeof v.word==="string";}))r.words=ks.map(function(k){var v=o[k];if(!v.id)v.id=k;return v;});}
    return r;}
  return{};}
function doImport(txt){var r=parseImport(txt),add=0,upd=0,same=0,cards=0,k;
  if(!r.words&&!r.cards)return "형식을 읽을 수 없습니다. JSON이거나 한 줄에 단어 하나씩 넣어 주세요.";
  if(r.words){r.words.forEach(function(it){var res=upsertWord(it,true);if(res==="added")add++;else if(res==="updated")upd++;else if(res==="same")same++;});persistWords();}
  if(r.cards){for(k in r.cards){var c=r.cards[k];if(S.words[k]&&c&&typeof c.s==="number"&&typeof c.due==="string"){S.prog[k]=c;cards++;}}persistProg();}
  S.failedToday={};if(!S.done)buildQueue();
  var m=[];if(add)m.push("추가 "+add);if(upd)m.push("갱신 "+upd);if(same)m.push("변경 없음 "+same);if(cards)m.push("기록 "+cards);
  return m.length?m.join(", ")+"개":"들어온 항목이 없습니다";}
function copyText(txt,btn,label){var done=function(){if(btn){btn.textContent="복사됨";setTimeout(function(){btn.textContent=label;},1500);}};
  var fallback=function(){S.ioText=txt;render();var t=document.getElementById("io");if(t){t.focus();t.select();}};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,fallback);else fallback();}

/* render */
function render(){
  document.querySelectorAll('[data-act="tab"]').forEach(function(b){b.setAttribute("aria-pressed",b.dataset.tab===S.tab?"true":"false");});
  document.querySelector('[data-act="settings"]').setAttribute("aria-expanded",S.settingsOpen?"true":"false");
  document.querySelector('[data-act="add"]').setAttribute("aria-expanded",S.formOpen?"true":"false");
  renderForm();renderSettings();renderCounts();
  if(S.tab==="study")renderStudy();else renderList();}

function renderCounts(){var rev=0,neu=0,fin=0,nodef=0,k;
  S.queue.forEach(function(id){if(!S.words[id])return;if(S.prog[id])rev++;else neu++;});
  for(k in S.prog){if(S.words[k]&&S.prog[k].s>=5)fin++;}
  S.order.forEach(function(id){if(!S.words[id].ko)nodef++;});
  document.getElementById("counts").innerHTML='<span>복습 <b>'+rev+'</b></span><span>신규 <b>'+neu+'</b></span><span>정착 <b>'+fin+'</b></span><span>전체 <b>'+S.order.length+'</b>'+(nodef?' <span style="color:var(--mid)">(뜻 없음 '+nodef+')</span>':'')+'</span>';
  var total=S.done+S.queue.length;document.getElementById("meter").style.width=(total?Math.round(S.done/total*100):0)+"%";}

function renderForm(){var el=document.getElementById("form");el.hidden=!S.formOpen;if(!S.formOpen)return;
  if(el.dataset.for===(S.editId||"new")&&el.children.length)return;
  el.dataset.for=S.editId||"new";var w=S.editId?S.words[S.editId]:{},h='<div class="set-row col"><div>'+(S.editId?"단어 수정":"단어 추가")+'<small>단어만 넣어 두고 뜻은 나중에 내보내기·가져오기로 채워도 됩니다</small></div>';
  FIELDS.forEach(function(f){var k=f[0];h+='<div class="field"><label for="f-'+k+'">'+f[1]+(k==="word"?" (필수)":"")+'</label><input id="f-'+k+'" data-field="'+k+'" value="'+esc(w[k]||"")+'" '+(k==="word"?'autocapitalize="off" autocorrect="off" spellcheck="false"':'')+'></div>';});
  h+='<div class="form-actions"><button class="solid sm" data-act="form-save">'+(S.editId?"저장":"추가")+'</button><button class="pill" data-act="form-close">닫기</button>'+
    (S.editId?'<button class="pill danger" data-act="form-delete" style="margin-left:auto">'+(S.confirmDelete===S.editId?"정말 삭제":"삭제")+'</button>':'')+'</div></div>';
  el.innerHTML=h;}

function renderSettings(){var el=document.getElementById("settings");el.hidden=!S.settingsOpen;if(!S.settingsOpen)return;
  var h='';
  h+='<div class="set-row"><div>소리 먼저<small>'+(canSpeak?"카드에서 단어를 가린 채 음성만 듣고 뜻을 떠올립니다":"이 기기에서는 음성 재생을 쓸 수 없습니다")+'</small></div><button class="switch" role="switch" data-act="opt-audio" aria-checked="'+(S.opt.audioFirst?"true":"false")+'" '+(canSpeak?"":"disabled")+' aria-label="소리 먼저"></button></div>';
  h+='<div class="set-row"><div>천천히 읽기<small>음성 속도를 0.75배로</small></div><button class="switch" role="switch" data-act="opt-slow" aria-checked="'+(S.opt.slow?"true":"false")+'" '+(canSpeak?"":"disabled")+' aria-label="천천히 읽기"></button></div>';
  h+='<div class="set-row"><div>하루 신규 단어<small>복습은 수와 상관없이 전부 나옵니다</small></div><div class="steps">'+[10,15,20].map(function(n){return '<button data-act="opt-new" data-n="'+n+'" aria-pressed="'+(S.opt.newPerDay===n?"true":"false")+'">'+n+'</button>';}).join("")+'</div></div>';
  h+='<div class="set-row col"><div>내보내기<small>복사한 텍스트를 AI에 보내 뜻·발음을 채운 뒤 아래에 붙여넣으면 덮어씌워집니다</small></div>';
  h+='<div class="io-row"><div class="steps">'+[["all","전체"],["list","현재 리스트"],["nodef","뜻 없는 단어"]].map(function(f){return '<button data-act="ex-scope" data-s="'+f[0]+'" aria-pressed="'+(S.exScope===f[0]?"true":"false")+'">'+f[1]+'</button>';}).join("")+'</div></div>';
  h+='<div class="io-row"><button class="pill" data-act="ex-prog" aria-pressed="'+(S.exProg?"true":"false")+'" style="'+(S.exProg?"background:var(--ink);color:var(--card);border-color:var(--ink)":"")+'">학습 기록 포함</button><button class="solid sm" data-act="export">복사</button></div></div>';
  h+='<div class="set-row col"><div>가져오기<small>JSON, 또는 한 줄에 단어 하나(탭으로 뜻 구분 가능). 같은 단어는 빈 칸만이 아니라 값이 있는 칸을 모두 덮어씁니다</small></div>';
  h+='<textarea id="io" placeholder="여기에 붙여넣기">'+esc(S.ioText)+'</textarea><div class="io-row"><button class="solid sm" data-act="import">가져오기</button><button class="pill" data-act="io-clear">비우기</button></div></div>';
  h+='<div class="set-row"><div>학습 기록<small>모든 단어를 신규 상태로 되돌립니다</small></div><button class="pill danger" data-act="reset">'+(S.confirmReset?"한 번 더 누르면 초기화":"기록 초기화")+'</button></div>';
  if(el.innerHTML!==h){var had=document.activeElement&&document.activeElement.id==="io",v=had?document.activeElement.value:null;el.innerHTML=h;if(had){var t=document.getElementById("io");if(t){t.value=v;t.focus();}}}}

function noDefLine(){return '<div class="line"><span class="tag">한</span><div class="note">뜻이 아직 없습니다. 리스트에서 수정하거나 내보내기로 채우세요.</div></div>';}

function renderStudy(){var view=document.getElementById("view"),footer=document.getElementById("footer"),actions=document.getElementById("actions");
  var pre=(S.saveError?'<div class="banner">기기에 저장할 수 없습니다. 설정에서 내보내기로 백업해 두세요.</div>':"")+(S.toast?'<div class="toast">'+esc(S.toast)+'</div>':"");
  if(!S.order.length){footer.hidden=true;view.innerHTML=pre+'<div class="empty"><h2>아직 단어가 없습니다</h2><p>오른쪽 위 + 로 추가하거나 설정에서 가져오세요.</p></div>';return;}
  var w=current();
  if(!w){footer.hidden=true;var left=freshLeft();
    view.innerHTML=pre+'<div class="empty"><h2>오늘 분량을 마쳤습니다</h2><p>내일 복습할 단어는 '+dueTomorrow()+'개입니다.'+(left?' 아직 시작하지 않은 단어가 '+left+'개 남아 있습니다.':'')+'</p>'+(left?'<button class="solid" data-act="more">신규 5개 더 하기</button>':'')+'</div>';return;}
  var p=S.prog[w.id],hide=S.opt.audioFirst&&!S.revealed&&canSpeak,h=pre;
  h+='<article class="card"><div class="card-top"><span>'+esc(stageLabel(p))+'</span><span>'+esc(w.src||"")+'</span></div><div class="front">';
  if(hide){h+='<button class="listen big" data-act="say">'+SPK+' 단어 듣기</button><p class="hint">소리만 듣고 뜻을 떠올리세요</p>';
    if(w.ex)h+='<div class="listen-row"><button class="listen" data-act="say-ex">'+SPK+' 예문으로 듣기</button></div>';}
  else{h+='<h1 class="word"><span>'+esc(w.word)+'</span></h1>'+(w.ipa?'<p class="ipa">'+esc(w.ipa)+'</p>':'');
    if(canSpeak)h+='<div class="listen-row"><button class="listen" data-act="say">'+SPK+' 듣기</button></div>';}
  h+='</div>';
  if(S.revealed){h+='<div class="back">';
    h+=w.ko?'<div class="line"><span class="tag">한</span><div class="ko">'+esc(w.ko)+'</div></div>':noDefLine();
    if(w.en)h+='<div class="line"><span class="tag">EN</span><div>'+esc(w.en)+'</div></div>';
    if(w.ja)h+='<div class="line"><span class="tag">日</span><div class="ja" lang="ja">'+esc(w.ja)+'</div></div>';
    if(w.ex)h+='<div class="line"><span class="tag">예문</span><div><div class="ex" lang="en">'+esc(w.ex)+'</div>'+(canSpeak?'<button class="ex-say" data-act="say-ex">'+SPK+' 예문 듣기</button>':'')+'</div></div>';
    if(w.note)h+='<div class="line"><span class="tag">메모</span><div class="note">'+esc(w.note)+'</div></div>';
    h+='</div>';}
  h+='</article>';view.innerHTML=h;
  footer.hidden=false;
  if(!S.revealed){actions.innerHTML='<button class="reveal" data-act="reveal">답 보기</button>';}
  else{var again=!!S.failedToday[w.id],ns=Math.min(5,(p?p.s:0)+1);
    actions.innerHTML='<div class="rate"><button class="r-bad" data-act="rate" data-k="bad">모름<small>곧 다시</small></button>'+
      '<button class="r-mid" data-act="rate" data-k="mid">애매<small>내일 다시</small></button>'+
      '<button class="r-good" data-act="rate" data-k="good">알아<small>'+(again?"내일 다시":inLabel(INTERVALS[ns]))+'</small></button></div>';}}

function renderList(){document.getElementById("footer").hidden=true;var view=document.getElementById("view");
  var q=S.q.trim().toLowerCase(),t=today();
  var ids=S.order.filter(function(id){var w=S.words[id],p=S.prog[id],b=bucket(w,p);
    if(S.filter==="today"){if(!S.graded[id]&&!(b==="new"||(p&&p.due<=t)))return false;}
    else if(S.filter!=="all"&&S.filter!==b)return false;
    if(!q)return true;return (w.word+" "+(w.ko||"")+" "+(w.ja||"")+" "+(w.en||"")).toLowerCase().indexOf(q)>=0;});
  S.listIds=ids;
  var F=[["today","오늘"],["all","전체"],["new","신규"],["learning","복습중"],["done","정착"],["nodef","뜻 없음"]];
  var had=document.activeElement&&document.activeElement.id==="q";
  var hideMode=S.listMode==="hide";

  if(!ids.length){h+='<div class="empty"><p>'+(S.order.length?(S.filter==="today"?"오늘 할 단어를 모두 확인했습니다":"조건에 맞는 단어가 없습니다"):"아직 단어가 없습니다")+'</p></div>';}
  else{h+='<div class="rows">'+ids.map(function(id){var w=S.words[id],p=S.prog[id],b=bucket(w,p),g=S.graded[id],peek=!!S.peek[id],showKo=!hideMode||peek;
    var right='';
    if(g)right='<span class="row-r '+(g==="good"?"g":"b")+'">'+(g==="good"?"알아":"모름")+' · '+esc(p?inLabel(Math.max(1,(p.due>t)?Math.round((new Date(p.due)-new Date(t))/864e5):1)):"")+'</span>';
    else{right='<span class="mini">'+(canSpeak?'<button data-act="say-id" data-id="'+esc(id)+'" aria-label="듣기">'+SPK+'</button>':'')+
      (hideMode?'<button data-act="peek" data-id="'+esc(id)+'" aria-pressed="'+(peek?"true":"false")+'" aria-label="뜻 보기">'+EYE+'</button>':'')+
      (w.ko?'<button class="no" data-act="lgrade" data-id="'+esc(id)+'" data-k="bad" aria-label="모름">✕</button><button class="ok" data-act="lgrade" data-id="'+esc(id)+'" data-k="good" aria-label="알아">○</button>':'')+'</span>';}
    return '<details'+(S.openId===id?' open':'')+' data-id="'+esc(id)+'"><summary><span class="dot '+(b==="learning"?"s1":b==="done"?"s2":b==="nodef"?"s0":"")+'"></span><span><span class="row-w">'+esc(w.word)+'</span>'+
      (showKo?' <span class="row-k'+(peek?" peek":"")+'">'+esc(w.ko||"뜻 없음")+'</span>':'')+'</span>'+right+'</summary><div class="detail">'+
      (w.ipa?'<p>'+esc(w.ipa)+'</p>':'')+(hideMode&&!peek&&w.ko?'<p><b>'+esc(w.ko)+'</b></p>':'')+(w.en?'<p>'+esc(w.en)+'</p>':'')+(w.ja?'<p class="ja" lang="ja">'+esc(w.ja)+'</p>':'')+
      (w.ex?'<p lang="en">'+esc(w.ex)+'</p>':'')+(w.note?'<p class="note">'+esc(w.note)+'</p>':'')+
      '<p class="meta">'+esc(stageLabel(p))+(p?' · 다음 복습 '+esc(p.due):'')+(p&&p.fails?' · 틀린 횟수 '+p.fails:'')+(w.src?' · '+esc(w.src):'')+'</p>'+
      '<div class="acts"><button class="pill" data-act="edit" data-id="'+esc(id)+'">수정</button></div></div></details>';}).join("")+'</div>';}
  view.innerHTML=h;
  if(had){var inp=document.getElementById("q");inp.focus();try{inp.setSelectionRange(S.q.length,S.q.length);}catch(e){}}}

/* events */
document.addEventListener("click",function(ev){var b=ev.target.closest("[data-act]");if(!b)return;var a=b.dataset.act,w,id;
  if(a==="tab"){S.tab=b.dataset.tab;if(S.tab==="study"&&!S.done)buildQueue();if(S.tab==="list"){S.graded={};}render();}
  else if(a==="settings"){S.settingsOpen=!S.settingsOpen;S.formOpen=false;S.confirmReset=false;render();}
  else if(a==="add"){if(S.formOpen&&!S.editId){S.formOpen=false;}else{S.formOpen=true;S.editId=null;S.settingsOpen=false;document.getElementById("form").dataset.for="";}render();
    if(S.formOpen){var fw=document.getElementById("f-word");if(fw)fw.focus();}}
  else if(a==="edit"){S.formOpen=true;S.editId=b.dataset.id;S.confirmDelete=null;S.settingsOpen=false;document.getElementById("form").dataset.for="";render();window.scrollTo(0,0);}
  else if(a==="form-close"){S.formOpen=false;S.editId=null;render();}
  else if(a==="form-save"){var item={};document.querySelectorAll("#form [data-field]").forEach(function(i){item[i.dataset.field]=i.value;});
    if(!item.word.trim()){toast("단어를 입력하세요");return;}
    if(S.editId){var ex=S.words[S.editId];FIELDS.forEach(function(f){var k=f[0],v=item[k].trim();if(v)ex[k]=v;else delete ex[k];});
      if(slug(ex.word)!==S.editId&&!S.words[slug(ex.word)]){var nid=slug(ex.word);ex.id=nid;S.words[nid]=ex;delete S.words[S.editId];if(S.prog[S.editId]){S.prog[nid]=S.prog[S.editId];delete S.prog[S.editId];persistProg();}S.deleted[S.editId]=1;rebuildOrder();}
      persistWords();S.formOpen=false;S.editId=null;toast("저장했습니다");}
    else{var r=upsertWord(item,true);persistWords();if(r==="added"){S.formOpen=false;document.getElementById("form").dataset.for="";toast("추가했습니다: "+item.word.trim());}else toast("이미 있는 단어입니다"+(r==="updated"?" (빈 칸을 채웠습니다)":""));}
    if(!S.done)buildQueue();render();}
  else if(a==="form-delete"){if(S.confirmDelete!==S.editId){S.confirmDelete=S.editId;document.getElementById("form").dataset.for="";render();return;}
    deleteWord(S.editId);S.formOpen=false;S.editId=null;S.confirmDelete=null;if(!S.done)buildQueue();toast("삭제했습니다");}
  else if(a==="reveal"){S.revealed=true;render();}
  else if(a==="rate"){rate(b.dataset.k);}
  else if(a==="say"){w=current();if(w)speak(w.say||w.word);}
  else if(a==="say-ex"){w=current();if(w)speak(w.ex);}
  else if(a==="say-id"){ev.preventDefault();w=S.words[b.dataset.id];if(w)speak(w.say||w.word);}
  else if(a==="peek"){ev.preventDefault();id=b.dataset.id;if(S.peek[id])delete S.peek[id];else S.peek[id]=1;render();}
  else if(a==="peek-clear"){S.peek={};render();}
  else if(a==="lgrade"){ev.preventDefault();id=b.dataset.id;grade(id,b.dataset.k,false);S.graded[id]=b.dataset.k;delete S.peek[id];render();}
  else if(a==="lmode"){S.listMode=b.dataset.m;S.peek={};render();}
  else if(a==="more"){S.extraNew+=5;buildQueue();render();autoSay();}
  else if(a==="filter"){S.filter=b.dataset.f;S.graded={};render();}
  else if(a==="opt-audio"){S.opt.audioFirst=!S.opt.audioFirst&&canSpeak;saveOpt();render();}
  else if(a==="opt-slow"){S.opt.slow=!S.opt.slow;saveOpt();render();}
  else if(a==="opt-new"){S.opt.newPerDay=parseInt(b.dataset.n,10);saveOpt();if(!S.done)buildQueue();render();}
  else if(a==="ex-scope"){S.exScope=b.dataset.s;render();}
  else if(a==="ex-prog"){S.exProg=!S.exProg;render();}
  else if(a==="export"){if(S.exScope==="list"&&!S.listIds.length){toast("리스트 탭에서 검색·필터로 범위를 먼저 정하세요");return;}copyText(exportText(),b,"복사");}
  else if(a==="io-clear"){S.ioText="";var ta=document.getElementById("io");if(ta)ta.value="";}
  else if(a==="import"){var ta2=document.getElementById("io"),msg=doImport(ta2?ta2.value:"");S.ioText="";render();toast(msg);}
  else if(a==="reset"){if(!S.confirmReset){S.confirmReset=true;render();return;}
    S.confirmReset=false;S.prog={};S.failedToday={};S.graded={};S.extraNew=0;persistProg();buildQueue();render();}
});
document.addEventListener("toggle",function(ev){var d=ev.target;if(d.tagName==="DETAILS")S.openId=d.open?d.dataset.id:null;},true);
document.addEventListener("input",function(ev){if(ev.target.id==="q"){S.q=ev.target.value;renderList();}else if(ev.target.id==="io"){S.ioText=ev.target.value;}});
document.addEventListener("keydown",function(ev){if(S.tab!=="study"||/INPUT|TEXTAREA/.test(ev.target.tagName))return;
  if(ev.key===" "&&!S.revealed&&current()){ev.preventDefault();S.revealed=true;render();}
  else if(S.revealed&&ev.key==="1")rate("bad");else if(S.revealed&&ev.key==="2")rate("mid");else if(S.revealed&&ev.key==="3")rate("good");});

/* init */
(function(){var o=lsGet(OKEY);if(o){if(typeof o.audioFirst==="boolean")S.opt.audioFirst=o.audioFirst&&canSpeak;if([10,15,20].indexOf(o.newPerDay)>=0)S.opt.newPerDay=o.newPerDay;if(typeof o.slow==="boolean")S.opt.slow=o.slow;}
  var stored=lsGet(WKEY),del=lsGet(DKEY)||{},k;S.deleted=del;
  if(stored&&typeof stored==="object"){for(k in stored){if(stored[k]&&typeof stored[k].word==="string"){stored[k].id=k;S.words[k]=stored[k];}}}
  var added=0;EMBEDDED.forEach(function(w){if(!S.words[w.id]&&!del[w.id]){S.words[w.id]=JSON.parse(JSON.stringify(w));added++;}});
  rebuildOrder();if(added)persistWords();
  var p=lsGet(PKEY);S.prog=(p&&typeof p==="object")?p:{};
  buildQueue();render();autoSay();
  try{if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(function(){});}catch(e){}})();
})();
</script>
</body>
